<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LLM 聊天应用</title>
<style>
:root {
	--primary-color: #f6821f;
	--primary-hover: #e67e22;
	--light-bg: #f9fafb;
	--border-color: #e5e7eb;
	--text-color: #1f2937;
	--text-light: #6b7280;
	--user-msg-bg: #fff2e6;
	--assistant-msg-bg: #f3f4f6;
}
* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
}
body {
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
	line-height: 1.6;
	color: var(--text-color);
	max-width: 800px;
	margin: 0 auto;
	padding: 1rem;
}
header {
	text-align: center;
	margin-bottom: 2rem;
	padding: 1rem 0;
	border-bottom: 1px solid var(--border-color);
}
h1 {
	font-size: 1.5rem;
	color: var(--primary-color);
}
.chat-container {
	display: flex;
	flex-direction: column;
	height: calc(100vh - 200px);
	min-height: 400px;
	border: 1px solid var(--border-color);
	border-radius: 8px;
	overflow: hidden;
}
/* 消息容器改为弹性纵向布局 */
#chat-messages {
	flex: 1;
	overflow-y: auto;
	padding: 1rem;
	background-color: var(--light-bg);
	display: flex;
	flex-direction: column;
	gap: 1rem;
}
/* 外层对齐容器：占满整行，用来左右浮动 */
.msg-wrap {
	width: 100%;
	display: flex;
}
.msg-wrap.user {
	justify-content: flex-end;
}
.msg-wrap.assistant {
	justify-content: flex-start;
}
/* 内层气泡：自适应文字宽度，限制最大宽度 */
.message {
	padding: 0.75rem;
	border-radius: 8px;
	max-width: 80%;
	width: fit-content;
}
.message p {
	white-space: pre-line;
	margin: 0;
	overflow-wrap: anywhere;
}
.user-message {
	background-color: var(--user-msg-bg);
}
.assistant-message {
	background-color: var(--assistant-msg-bg);
}
.message-input {
	display: flex;
	padding: 0.75rem;
	border-top: 1px solid var(--border-color);
	background-color: white;
}
#user-input {
	flex: 1;
	padding: 0.75rem;
	border: 1px solid var(--border-color);
	border-radius: 4px;
	font-family: inherit;
	resize: none;
	min-height: 44px;
}
#send-button {
	margin-left: 0.5rem;
	padding: 0 1rem;
	background-color: var(--primary-color);
	color: white;
	border: none;
	border-radius: 4px;
	cursor: pointer;
	transition: background-color 0.2s;
}
#send-button:hover {
	background-color: var(--primary-hover);
}
#send-button:disabled {
	background-color: var(--text-light);
	cursor: not-allowed;
}
.typing-indicator {
	display: none;
	font-style: italic;
	color: var(--text-light);
	padding: 1rem;
}
.typing-indicator.visible {
	display: block;
}
footer {
	margin-top: 1rem;
	text-align: center;
	font-size: 0.85rem;
	color: var(--text-light);
}
</style>
</head>
<body>
<header>
	<h1>Cloudflare AI 聊天</h1>
	<p>由Cloudflare Workers AI驱动</p>
</header>
<div class="chat-container">
	<div id="chat-messages" class="chat-messages">
		<!-- 初始AI消息，双层嵌套结构 -->
		<div class="msg-wrap assistant">
			<div class="message assistant-message">
				<p>你好！我是由Cloudflare Workers AI驱动的LLM聊天应用。请问有什么可以帮您？</p>
			</div>
		</div>
	</div>
	<div class="typing-indicator" id="typing-indicator">AI is thinking...</div>
	<div class="message-input">
		<textarea id="user-input" placeholder="在这里输入您的信息......" rows="1" autofocus></textarea>
		<button id="send-button">发送</button>
	</div>
</div>
<footer>
	<p>Cloudflare Workers AI 聊天模板 &copy; 2025</p>
</footer>
<script src="chat.js"></script>
</body>
</html>
